<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" routerLink="/" (click)="closeMenu()" aria-label="Portfolio home">
      <span class="site-header__monogram" aria-hidden="true">SE</span>
      <span class="site-header__name">Software Engineer</span>
    </a>

    <nav class="site-header__nav" [class.site-header__nav--open]="menuOpen()" aria-label="Primary">
      <ul class="site-header__list">
        @for (item of navItems; track item.label) {
          <li>
            @if (item.implemented) {
              <a class="site-header__link" [href]="item.href" (click)="closeMenu()">
                {{ item.label }}
              </a>
            } @else {
              <span
                class="site-header__link site-header__link--disabled"
                aria-disabled="true"
                [attr.title]="item.label + ' — coming soon'"
              >
                {{ item.label }}
              </span>
            }
          </li>
        }
      </ul>
    </nav>

    <div class="site-header__actions">
      <button
        type="button"
        class="site-header__theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'light' ? 'Switch to dark theme' : 'Switch to light theme'"
      >
        @if (theme() === 'light') {
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        }
      </button>

      <button
        type="button"
        class="site-header__menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="primary-nav"
        aria-label="Toggle navigation menu"
      >
        @if (menuOpen()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
          </svg>
        }
      </button>
    </div>
  </div>
</header>
