<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand-block">
      <p class="site-footer__brand display">{{ profile.name }}</p>
      <p class="site-footer__tagline">{{ profile.headline }}</p>
    </div>

    <div class="site-footer__links">
      <a [href]="'mailto:' + profile.email">{{ profile.email }}</a>
      <a [href]="profile.links.cv" download>CV (PDF)</a>
      @if (hasLink(profile.links.github)) {
        <a [href]="profile.links.github" target="_blank" rel="noopener noreferrer">GitHub</a>
      }
      @if (hasLink(profile.links.linkedin)) {
        <a [href]="profile.links.linkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      }
      @if (hasLink(profile.links.hackerrank)) {
        <a [href]="profile.links.hackerrank" target="_blank" rel="noopener noreferrer">HackerRank</a>
      }
    </div>
  </div>
</footer>
